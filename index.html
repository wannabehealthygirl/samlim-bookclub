<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>삼림이식회 문장노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 책 한 권을 펼친 듯한 좁은 한 단(680px). 위 책 정보 → 탭 → 주간 칸표 → 문장 카드.
   문장은 명조 + 형광펜 밑줄, 화면 조작 글자는 고딕. 색은 먹색 계열 하나에 형광펜 한 가지만. */
:root{
  --paper:#f5f6f3; --sheet:#ffffff; --ink:#1e2320; --muted:#6a716c; --rule:#dcdfda;
  --pencil:#3d5a73; --mark:rgba(236,214,92,.55); --dot:#1e2320; --dot-off:#e7e9e5;
  --serif:'Nanum Myeongjo','Batang',serif;
  --sans:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.1875rem; --fs-xl:1.75rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151816; --sheet:#1c201d; --ink:#e4e7e2; --muted:#9aa29c; --rule:#30352f;
  --pencil:#9db8cf; --mark:rgba(196,170,40,.38); --dot:#e4e7e2; --dot-off:#2b302c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151816; --sheet:#1c201d; --ink:#e4e7e2; --muted:#9aa29c; --rule:#30352f;
  --pencil:#9db8cf; --mark:rgba(196,170,40,.38); --dot:#e4e7e2; --dot-off:#2b302c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fs-md);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.wrap>*,section>*,.feed>*{min-width:0;max-width:100%}
main{display:flex;flex-direction:column;gap:28px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px;border-radius:4px}

/* 책 정보 */
.mast{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.08em;color:var(--muted)}
.book-title{font-family:var(--serif);font-weight:800;font-size:var(--fs-xl);line-height:1.25;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-sm);color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}

/* 탭 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule)}
.tab{padding:8px 12px;font-size:var(--fs-sm);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--ink);font-weight:600}

section{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:var(--fs-md);font-weight:600;margin:0}
.hint{font-size:var(--fs-xs);color:var(--muted)}

/* 주간 칸표 */
.board-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px}
.board{display:grid;grid-template-columns:minmax(64px,1fr) repeat(7,30px) 52px;gap:6px 4px;align-items:center;font-variant-numeric:tabular-nums;min-width:330px}
.board .dh{font-size:var(--fs-xs);color:var(--muted);text-align:center}
.board .dh.today{color:var(--ink);font-weight:600}
.board .nm{font-size:var(--fs-sm);text-align:left;padding:2px 0;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.cell{height:26px;border-radius:4px;background:var(--dot-off);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:600}
.cell.on{background:var(--dot);color:var(--paper)}
.cell.future{background:transparent;border:1px dashed var(--rule)}
.tot{font-size:var(--fs-sm);text-align:right;white-space:nowrap}
.tot.ok{font-weight:600}
.tot.ok::after{content:" ✓"}
.weeknav{display:flex;gap:6px;align-items:center;font-size:var(--fs-sm)}
.weeknav button{padding:2px 8px;border:1px solid var(--rule);border-radius:4px}
.weeknav button:disabled{opacity:.35;cursor:default}

/* 문장 카드 */
.feed{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-top{display:flex;gap:10px;align-items:baseline;font-size:var(--fs-xs);color:var(--muted);flex-wrap:wrap}
.card-top .who{color:var(--ink);font-weight:600;font-size:var(--fs-sm);text-decoration:none}
.card-top .pg{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--pencil);font-weight:600}
.quote{font-family:var(--serif);font-size:var(--fs-lg);line-height:1.85;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.quote span{background:linear-gradient(transparent 58%,var(--mark) 58%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.thought{font-size:var(--fs-sm);color:var(--muted);margin:0;white-space:pre-line;border-left:2px solid var(--rule);padding-left:10px}
.photo{font-size:var(--fs-sm);color:var(--muted)}
mark{background:var(--mark);color:inherit}

/* 사람 고르기 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border:1px solid var(--rule);border-radius:999px;font-size:var(--fs-sm);text-decoration:none;background:var(--sheet)}
.chip[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 개인 페이지 */
.person-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.person-h h2{font-family:var(--serif);font-size:var(--fs-xl);margin:0}
.weeks{display:flex;flex-wrap:wrap;gap:6px}
.wk{font-size:var(--fs-xs);padding:4px 10px;border-radius:4px;background:var(--dot-off);font-variant-numeric:tabular-nums}
.wk.ok{background:var(--dot);color:var(--paper)}

.search{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:var(--fs-sm);background:var(--sheet);border:1px dashed var(--rule);border-radius:6px}
.next{font-size:var(--fs-sm);color:var(--muted)}
footer{font-size:var(--fs-xs);color:var(--muted);border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}
</style>

 "s": "컵 하나를 바로 씻는 사람의 인생에는 ‘괴로운 대청소’라는 개념 자체가 존재하지 않는다.\n단지 5초짜리 가벼운 정리만 반복하면서 쾌적한 마음만을 유지할 뿐이다.\n-\n어떤 컵 하나를 바로 씻는 시간이 쌓여야\n‘괴로운 회사생활’에서 시원하게 벗어날수 있을지 고민 좀 ..", "t": "이 글을 읽으니 언어천재 조승현도 하루 3분 반복으로 틈새 언어공부를 한다는 말이 떠오르네요", "b": "b1", "k": "text"}, {"id": "3970152423492141057", "m": "wonju", "d": "2026-11-09", "p": 117, "s": "너무 애쓰지 마라. 모든 과정에서 완벽하려 들지 않아도 된다. 다만 네가 전하고싶은 그 진심이 관객의 마음에 닿을 수 있을 만큼의 탁월함이면 충분하다.", "t": "", "b": "b1", "k": "text"}, {"id": "3970154767252439045", "m": "wonju", "d": "2026-11-09", "p": 119, "s": "완벽보다 중요한 것은 ‘완성‘이며, 그 완성을 가능하게 하는 것은 자신만의 ’탁월함에 대한 정의’이기 때문이다\n완벽은 외부의 시선과 숫자에 집작하게 만든다. 하지만 탁월함은 내가 도달하고자하는 감정과 본질에 집중하게한다\n-\n오늘 곱씹어 생각해 볼 문장!", "t": "", "b": "b1", "k": "text"}, {"id": "3970264711985121281", "m": "narae", "d": "2026-11-09", "p": null, "s": "완벽을 추구하는 이에게 작품이란 진정으로 완성되는 것이 아니다. 불길 속에 던져지든 대중에게 내놓아지든, 버려지는 것에 가깝다.", "t": "어느 시인이자 철학자는 말했다.  완벽주의는 종종 짐이 되기도 하지만, 우리를 앞으로 나아가게 하는 동력이 되기도 한다. 그 여정에서 풀어야 할 두 개의 자물쇠가 있다. 바로 백지상태에서 어떻게 시작해야 하는지 아는 것, 그리고 결코 '완성'될 수는 없더라도 이 작업물이 세상에 나갈 준비가 언제 되었는지를 이해하는 것이다.\n\n[소감]\n몇 년 전만 해도 완벽주의는 직장생활에서 꽤 쓸모 있는 나의 무기였다. 이 성향 덕분에 좋은 퀄리티의 결과물을 낼 수 있었기 때문이다. 하지만 빠르고 유연한 대처가 점점 더 중요해지는 요즘, 이 성향이 오히려 커다란 단점처럼 느껴진다. 국내에서 가장 빠르게 변하는 플랫폼 기업에서 일하며 퀄리티보다 속도를 우선해 결과물을 쉴 새 없이 찍어내야 했고, 완벽한 결과물에 집착하는 나에게는 정말 힘든 환경이었다. 결국 완벽주의는 더 이상 매력적인 직원의 조건이 아닐지도 모른다는 생각에까지 이르렀다. 그런데 이 책은 \"완벽주의자여도 괜찮아, 이 방법으로 완벽함의 강점을 잘 살려보자\"라고 말해주는 것 같다. 서론에 나온 \"결코 '완성'될 수는 없더라도 이 작업물이 세상에 나갈 준비가 언제 되었는지를 이해하는 것\". 이 질문에 책이 어떤 답을 내놓을지 너무 궁금하다.", "b": "b1", "k": "text"}, {"id": "3970547831233417217", "m": "dajeong", "d": "2026-11-10", "p": null, "s": "어떻게 끝낼까?", "t": "가 아니라, \"어떤 결과물을 남길 것인가?\"를 먼저 정하는 것이다. 목표하는 '끝의 인상'이 선명해져야 무엇을 핵심으로 남기고 무엇을 버려야 할지 '잘라내기의 기준'이 선다.\n\n오늘 할 영상업무에서도 '영상을 본 사람들에게 어떤 인상을 남길지'에 대해 고민하며 작업을 해보려 합니다\n\n아침에 영하1도네요 모두 감기조심하시구 오늘도 파이팅임다❤️", "b": "b1", "k": "text"}]};
(function(){

  function addDays(s, n){ var d = parse(s); d.setDate(d.getDate()+n); return iso(d); }

  function md(s){ var p = s.split('-'); return (+p[1])+'.'+(+p[2]); }
  function dow(s){ return DAYS[(parse(s).getDay()+6)%7]; }
  function today(){ var n = new Date(); if (n.getHours() < 5) n.setDate(n.getDate()-1); return iso(n); }
  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

    D.books.forEach(function(b){ if (b.start <= t) cur = b; });
    return cur;
  }
  function sorted(list){ return list.slice().sort(function(a,b){ return a.d < b.d ? 1 : a.d > b.d ? -1 : (a.id < b.id ? 1 : -1); }); }

  function masthead(){
    var b = currentBook(), m = $('mast'); m.textContent = '';
    m.appendChild(el('div','eyebrow','삼림이식회 독서모임 · 기억에 남는 문장'));

    var s = el('span'); s.appendChild(document.createTextNode('줌 모임 '));

    if (left > 0) s.appendChild(document.createTextNode(' · D-'+left));
    else if (left === 0) s.appendChild(document.createTextNode(' · 오늘'));
    meta.appendChild(s);

    m.appendChild(meta);
  }

  function tabs(route){

    [['', '이번 주'], ['#book', '책 전체'], ['#people', '사람별'], ['#search', '찾기']].forEach(function(x){
      var a = el('a','tab', x[1]); a.href = x[0] || '#week';
      var on = (route === x[0]) || (x[0] === '#people' && route.indexOf('#m-') === 0);
      if (on) a.setAttribute('aria-current','page');
      t.appendChild(a);

  }

  function card(c, showWho){
    var k = el('article','card'), top = el('div','card-top');

    var q = el('p','quote'); q.appendChild(el('span', null, c.s)); k.appendChild(q);

  }

  function countOn(key, day){ return D.certs.filter(function(c){ return c.m === key && c.d === day; }).length; }

  function board(){
    var sec = el('section'), h = el('div','sec-h');
    var mon = addDays(mondayOf(today()), 7*weekOffset), sun = addDays(mon, 6);
    h.appendChild(el('h2', null, md(mon)+' – '+md(sun)+' 인증'));
    var nav = el('div','weeknav');
    var first = mondayOf(D.books[0].start);

    nav.appendChild(prev); nav.appendChild(el('span','hint','주 '+D.weeklyTarget+'회 목표')); nav.appendChild(next);

    g.appendChild(el('span'));
    for (var i = 0; i < 7; i++){ var dd = addDays(mon, i); g.appendChild(el('span','dh'+(dd === t ? ' today' : ''), DAYS[i])); }
    g.appendChild(el('span','dh','합계'));
    D.members.forEach(function(m){
      var nm = el('a','nm', m.name.slice(1)); nm.href = '#m-'+m.key; nm.title = m.name; g.appendChild(nm);
      var tot = 0;
      for (var i = 0; i < 7; i++){
        var d = addDays(mon, i), n = countOn(m.key, d); tot += n;
        var c = el('span','cell'+(n ? ' on' : (d > t ? ' future' : '')), n > 1 ? String(n) : '');
        c.title = m.name+' '+md(d)+' '+n+'개'; g.appendChild(c);
      }
      g.appendChild(el('span','tot'+(tot >= D.weeklyTarget ? ' ok' : ''), tot+'회'));
    });
    wrap.appendChild(g); sec.appendChild(wrap);
    sec.appendChild(el('p','hint','칸 안 숫자는 그날 올린 문장 수예요. 하루에 여러 개 올리면 올린 만큼 셉니다.'));
    return sec;
  }

  function weekView(){
    var v = document.createDocumentFragment();
    v.appendChild(board());
    var mon = addDays(mondayOf(today()), 7*weekOffset), sun = addDays(mon, 6);
    var list = sorted(D.certs.filter(function(c){ return c.d >= mon && c.d <= sun; }));
    var sec = el('section'), h = el('div','sec-h');
    h.appendChild(el('h2', null, '이번 주에 남긴 문장')); h.appendChild(el('span','hint', list.length+'개'));
    sec.appendChild(h);
    if (!list.length) sec.appendChild(el('div','empty','아직 이 주에 올라온 문장이 없어요. 카톡방에 문장을 올리면 다음 날 아침 여기에 모입니다.'));
    var f = el('div','feed'); list.forEach(function(c){ f.appendChild(card(c)); }); sec.appendChild(f);
    v.appendChild(sec);
    return v;
  }

  function bookView(){
    var b = currentBook(), sec = el('section'), h = el('div','sec-h');
    var list = D.certs.filter(function(c){ return c.b === b.id; }).sort(function(a,b){
      if (a.p && b.p) return a.p - b.p; if (a.p) return -1; if (b.p) return 1; return a.d < b.d ? -1 : 1; });
    h.appendChild(el('h2', null, '「'+b.title+'」에 모두가 남긴 문장'));
    h.appendChild(el('span','hint','쪽수 순서 · 쪽수 없는 문장은 뒤에'));
    sec.appendChild(h);
    if (!list.length) sec.appendChild(el('div','empty','아직 이 책 문장이 없어요.'));
    var f = el('div','feed'); list.forEach(function(c){ f.appendChild(card(c)); }); sec.appendChild(f);
    if (D.nextBooks.length) sec.appendChild(el('p','next','다음 책 후보 · '+D.nextBooks.join(' · ')));
    return sec;
  }

  function chips(active){
    var c = el('div','chips');
    D.members.forEach(function(m){
      var a = el('a','chip', m.name); a.href = '#m-'+m.key;
      if (m.key === active) a.setAttribute('aria-current','true');
      c.appendChild(a);
    });
    return c;
  }

  function peopleView(){
    var sec = el('section'), h = el('div','sec-h');
    h.appendChild(el('h2', null, '이름을 누르면 그 사람이 남긴 문장을 한 번에 볼 수 있어요'));
    sec.appendChild(h); sec.appendChild(chips(null));
    return sec;
  }

  function personView(key){
    var m = byKey[key]; if (!m) return peopleView();
    var sec = el('section'); sec.appendChild(chips(key));
    var mine = D.certs.filter(function(c){ return c.m === key; });
    var h = el('div','person-h'); h.appendChild(el('h2', null, m.name));
    h.appendChild(el('span','hint','문장 '+mine.length+'개')); sec.appendChild(h);
    var weeks = {}, ws = el('div','weeks');
    mine.forEach(function(c){ var w = mondayOf(c.d); weeks[w] = (weeks[w]||0)+1; });
    var w = mondayOf(D.books[0].start), last = mondayOf(today());
    while (w <= last){
      var n = weeks[w] || 0;
      ws.appendChild(el('span','wk'+(n >= D.weeklyTarget ? ' ok' : ''), md(w)+' 주 '+n+'회'));
      w = addDays(w, 7);
    }
    sec.appendChild(ws);
    D.books.slice().reverse().forEach(function(b){
      var list = mine.filter(function(c){ return c.b === b.id; }).sort(function(a,b){ return a.d < b.d ? -1 : 1; });
      if (!list.length) return;
      var bh = el('div','sec-h'); bh.appendChild(el('h2', null, '「'+b.title+'」')); bh.appendChild(el('span','hint', list.length+'개'));
      sec.appendChild(bh);
      var f = el('div','feed'); list.forEach(function(c){ f.appendChild(card(c, false)); }); sec.appendChild(f);
    });
    if (!mine.length) sec.appendChild(el('div','empty','아직 남긴 문장이 없어요. 카톡방에 첫 문장을 올려 주세요.'));
    return sec;
  }

  var q = '';
  function searchView(){
    var sec = el('section'), inp = el('input','search');
    inp.id = 'q'; inp.type = 'search'; inp.placeholder = '낱말로 찾기 (예: 청킹)'; inp.value = q;
    inp.setAttribute('aria-label','문장 찾기');
    var res = el('div','feed');
    function run(){
      q = inp.value.trim(); res.textContent = '';
      if (!q){ res.appendChild(el('div','empty','찾을 낱말을 넣어 주세요.')); return; }
      var hits = sorted(D.certs.filter(function(c){ return (c.s+' '+c.t).indexOf(q) >= 0; }));
      if (!hits.length){ res.appendChild(el('div','empty','「'+q+'」이 들어간 문장이 없어요.')); return; }
      hits.forEach(function(c){
        var k = card(c);
        k.querySelectorAll('.quote span, .thought').forEach(function(node){
          var txt = node.textContent, i = txt.indexOf(q); if (i < 0) return;
          node.textContent = '';
          node.appendChild(document.createTextNode(txt.slice(0,i)));
          node.appendChild(el('mark', null, q));
          node.appendChild(document.createTextNode(txt.slice(i+q.length)));
        });
        res.appendChild(k);
      });
    }
    inp.addEventListener('input', run);
    sec.appendChild(inp); sec.appendChild(res); run();
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 0);
    return sec;
  }

  function render(){
    var r = location.hash; if (r === '#week') r = '';
    masthead(); tabs(r);
    var v = $('view'); v.textContent = '';
    if (r === '#book') v.appendChild(bookView());
    else if (r === '#people') v.appendChild(peopleView());
    else if (r === '#search') v.appendChild(searchView());
    else if (r.indexOf('#m-') === 0) v.appendChild(personView(r.slice(3)));
    else v.appendChild(weekView());
    var f = $('foot'); f.textContent = '';
    var u = D.updated.replace('T',' ').split(' ');
    f.appendChild(el('span', null, '마지막 반영 '+md(u[0])+' '+u[1]+' · 카톡방에 올린 문장이 매일 아침 모입니다'));
    f.appendChild(el('span', null, '빠졌거나 잘못 들어간 문장은 방에 말씀해 주세요. 새벽 5시 전에 올린 문장은 전날 몫으로 셉니다.'));
  }
  window.addEventListener('hashchange', function(){ weekOffset = 0; render(); window.scrollTo(0,0); });
  render();
})();
</script>
</body></html>
